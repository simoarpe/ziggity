# Builds Ziggity for every supported OS/arch and publishes a GitHub Release
# with the binaries attached. Thanks to Zig's cross-compilation, one Linux
# runner produces all of them.
#
# Repo secrets (Settings → Secrets and variables → Actions). Both are optional:
# the matching step logs and skips when its secret is unset, so a release still
# succeeds. Each is a fine-grained PAT with Contents: read and write, scoped to
# ONLY the repo it updates (separate tokens keep the blast radius small):
#   Z_HOMEBREW_TAP_TOKEN  → simoarpe/homebrew-ziggity  (Update Homebrew tap step)
#   Z_SCOOP_BUCKET_TOKEN  → simoarpe/scoop-ziggity      (Update Scoop bucket step)
name: release

# ── When does this run? ───────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*"            # e.g. pushing the tag `v0.1.0` triggers a release
  workflow_dispatch: {} # ...and you can also start it by hand from the Actions tab

# The default token is read-only; creating a Release needs write access to the repo.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. Get the source (this exact tag's code).
      - uses: actions/checkout@v5

      # 2. Install the pinned Zig version. Zig is pre-1.0 and breaks between
      #    versions, so we lock it to what the project builds with.
      #    (Still on Node 20 as of v2.2.1 — GitHub runs it on Node 24 anyway;
      #    bump the major once mlugg/setup-zig ships a Node 24 release.)
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      # 3. Gate the release on the test suite — never ship a broken build.
      - name: Test
        run: zig build test

      # 4. Cross-compile every target and package each binary.
      - name: Build & package all targets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"   # the tag name, e.g. v0.1.0
          mkdir -p dist

          # <arch>-<os>-<abi>. musl → fully static Linux binaries that run on
          # any distro; windows-gnu → self-contained (no MSVC needed);
          # linux-android → static aarch64 binary for Termux on Android (no libc,
          # so it needs no NDK). See the README "Android (Termux)" section.
          # NOTE: the Windows build compiles and libvaxis supports Windows, but
          # it hasn't been smoke-tested on a real Windows box yet. The Android
          # binary has been verified in Termux on an emulator.
          targets=(
            aarch64-macos
            x86_64-macos
            x86_64-linux-musl
            aarch64-linux-musl
            riscv64-linux-musl
            aarch64-linux-android
            x86_64-windows-gnu
          )

          for t in "${targets[@]}"; do
            echo "::group::$t"
            # ReleaseSafe: optimized, but keeps runtime safety checks (good for
            # a tool that shells out to git and touches your repo).
            zig build -Dtarget="$t" -Doptimize=ReleaseSafe --prefix "zig-out/$t"

            bindir="zig-out/$t/bin"
            name="ziggity-${version}-${t}"
            if [[ "$t" == *windows* ]]; then
              (cd "$bindir" && zip -q "${GITHUB_WORKSPACE}/dist/${name}.zip" ziggity.exe)
            else
              tar -czf "dist/${name}.tar.gz" -C "$bindir" ziggity
            fi
            echo "::endgroup::"
          done

          # Checksums so users (and package managers) can verify downloads.
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      # 5. Pull this version's section out of CHANGELOG.md to use as the release
      #    body. The heading is stamped by release.sh as `## [X.Y.Z] - DATE`, so
      #    we match the tag with its leading `v` stripped and print the lines up
      #    to the next `## [`. Missing file or section just yields empty notes.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$ver" '
              $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
              grab && /^## \[/ { exit }
              grab { print }
            ' CHANGELOG.md | sed '/./,$!d' > RELEASE_NOTES.md
          else
            : > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      # 6. Create the GitHub Release for this tag and upload every asset, with a
      #    retry loop so a transient GitHub 5xx (one struck a past release mid-
      #    upload and left a half-finished draft) does not abort the release.
      #    Only on a tag push — a manual (workflow_dispatch) run stops after the
      #    build/package steps above, letting you dry-run without a release.
      #
      #    Body = the curated CHANGELOG section (step 5) followed by GitHub's
      #    auto-generated commit/compare summary, matching the old
      #    body_path + generate_release_notes behaviour.
      #
      #    Each attempt first deletes any release a failed earlier attempt left
      #    behind (the tag is kept), then creates the release as a draft and
      #    uploads all assets, and only flips it to published once that succeeds.
      #    So a failure partway never leaves a half-uploaded PUBLIC release, and a
      #    retry always starts from a clean slate. We drive this with `gh` rather
      #    than a release action because it gives us that cleanup-and-retry control.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Release body: curated CHANGELOG section, then GitHub's generated notes
          # appended. A generate-notes hiccup just omits that second half.
          gen="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                   -f tag_name="$TAG" --jq '.body' 2>/dev/null || true)"
          { cat RELEASE_NOTES.md; printf '\n\n'; printf '%s\n' "$gen"; } > FULL_NOTES.md

          publish() {
            # Clear anything a previous failed attempt left behind (keep the tag),
            # so each attempt starts clean rather than colliding with a partial.
            gh release delete "$TAG" --yes 2>/dev/null || true
            # Draft + all assets first; publish only once the upload fully succeeds
            # (|| return so a failure stops this attempt instead of falling through,
            # since `set -e` is suspended for a function called in an `until`).
            gh release create "$TAG" dist/* \
              --title "$TAG" --notes-file FULL_NOTES.md --verify-tag --draft || return 1
            gh release edit "$TAG" --draft=false --latest || return 1
          }

          n=1; max=5; delay=10
          until publish; do
            if [ "$n" -ge "$max" ]; then
              echo "::error::release publish failed after ${max} attempts"
              exit 1
            fi
            echo "::warning::publish attempt ${n} failed (likely a transient GitHub error); retrying in ${delay}s"
            sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
          done
          echo "published ${TAG}"

      # 7. Point the Homebrew tap at this release: render Formula/ziggity.rb from
      #    the template (new version + URLs + sha256s) and push it to
      #    simoarpe/homebrew-ziggity. Needs a token that can write to THAT repo —
      #    the default GITHUB_TOKEN only covers this one. Create a fine-grained
      #    PAT (contents: write on the tap repo) and add it as the repo secret
      #    Z_HOMEBREW_TAP_TOKEN. Without it, this step logs and skips (releases still
      #    succeed).
      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_TOKEN: ${{ secrets.Z_HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "Z_HOMEBREW_TAP_TOKEN not set — skipping the formula bump."
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"          # v0.2.0
          version="${tag#v}"                # 0.2.0
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          # sha256 of a given asset, from the checksums we just generated.
          sha() { awk -v f="ziggity-${tag}-$1" '$2==f{print $1}' dist/checksums.txt; }

          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__TAG__|${tag}|g" \
            -e "s|__BASE__|${base}|g" \
            -e "s|__SHA_MAC_ARM__|$(sha aarch64-macos.tar.gz)|g" \
            -e "s|__SHA_MAC_X64__|$(sha x86_64-macos.tar.gz)|g" \
            -e "s|__SHA_LIN_ARM__|$(sha aarch64-linux-musl.tar.gz)|g" \
            -e "s|__SHA_LIN_X64__|$(sha x86_64-linux-musl.tar.gz)|g" \
            .github/homebrew/ziggity.rb.tmpl > /tmp/ziggity.rb

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/simoarpe/homebrew-ziggity.git" tap
          mkdir -p tap/Formula
          cp /tmp/ziggity.rb tap/Formula/ziggity.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date."
          else
            git add Formula/ziggity.rb
            git commit -m "ziggity ${version}"
            git push
          fi

      # 8. Point the Scoop bucket at this release: render bucket/ziggity.json from
      #    the template (new version + URL + sha256) and push it to
      #    simoarpe/scoop-ziggity. Like the Homebrew step, needs a token that can
      #    write to THAT repo — create a fine-grained PAT (contents: write on the
      #    bucket repo) and add it as the repo secret Z_SCOOP_BUCKET_TOKEN.
      #    Without it, this step logs and skips (releases still succeed).
      - name: Update Scoop bucket
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUCKET_TOKEN: ${{ secrets.Z_SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET_TOKEN}" ]; then
            echo "Z_SCOOP_BUCKET_TOKEN not set — skipping the Scoop manifest bump."
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"          # v0.2.0
          version="${tag#v}"                # 0.2.0
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          # sha256 of a given asset, from the checksums we just generated.
          sha() { awk -v f="ziggity-${tag}-$1" '$2==f{print $1}' dist/checksums.txt; }

          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__TAG__|${tag}|g" \
            -e "s|__BASE__|${base}|g" \
            -e "s|__SHA_WIN_X64__|$(sha x86_64-windows-gnu.zip)|g" \
            .github/scoop/ziggity.json.tmpl > /tmp/ziggity.json

          git clone --depth 1 \
            "https://x-access-token:${BUCKET_TOKEN}@github.com/simoarpe/scoop-ziggity.git" scoop-bucket
          mkdir -p scoop-bucket/bucket
          cp /tmp/ziggity.json scoop-bucket/bucket/ziggity.json
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Manifest already up to date."
          else
            git add bucket/ziggity.json
            git commit -m "ziggity ${version}"
            git push
          fi
